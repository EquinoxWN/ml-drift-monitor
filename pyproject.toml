[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-drift-monitor"
version = "0.1.0"
description = "Catches a model quietly getting worse in production before your users, or your revenue, notice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
# SciPy is a test oracle only: the statistics are implemented with numpy and checked against it.
dev = ["pytest>=8", "hypothesis>=6.100", "scipy>=1.15", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[project.scripts]
drift = "ml_drift_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
